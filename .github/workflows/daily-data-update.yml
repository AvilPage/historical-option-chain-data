name: Daily Data Update

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD), optional"
        required: false
      to_date:
        description: "End date (YYYY-MM-DD), optional"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily FO update
        run: >
          uv run data.py --type fo
          ${{ github.event.inputs.from_date && format('--from-date {0}', github.event.inputs.from_date) || '' }}
          ${{ github.event.inputs.to_date && format('--to-date {0}', github.event.inputs.to_date) || '' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add data/fo
            git commit -m "chore: daily FO data update ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No changes to commit."
          fi

